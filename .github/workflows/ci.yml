name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install web and mobile workspaces
        run: pnpm install --no-frozen-lockfile
      - name: Shared client login contract regression tests
        run: node --experimental-transform-types --test packages/api-client/test/auth-contract.test.mjs
      - name: Shared package, web and mobile typecheck
        run: pnpm typecheck
      - name: Web production build
        run: pnpm --filter @sevamitra/web build
      - name: Backend dependencies
        working-directory: apps/backend
        run: npm ci
      - name: Backend production compilation
        working-directory: apps/backend
        run: npm run build
      - name: Backend unit tests and coverage
        working-directory: apps/backend
        run: npm run test:cov -- --runInBand
